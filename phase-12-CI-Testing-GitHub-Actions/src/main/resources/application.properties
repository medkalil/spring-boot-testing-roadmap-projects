spring.application.name=todo-api
server.port=8080

# Local/dev defaults; integration tests override the datasource through
# Testcontainers' @DynamicPropertySource - never hardcode localhost there.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5434/todo}
spring.datasource.username=${DB_USERNAME:todo}
spring.datasource.password=${DB_PASSWORD:todo}

# Flyway owns the schema; Hibernate only validates it.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
