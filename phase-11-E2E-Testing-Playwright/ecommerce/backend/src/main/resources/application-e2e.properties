# E2E profile: activated by e2e/scripts/start-backend.sh (Playwright webServer)
# and by scripts/reset-db.sh users. Points at the dedicated E2E PostgreSQL
# container defined in compose.e2e.yaml at the repository root.
#
# Everything else (ddl-auto=validate, jwt, jwtExpirationMs, ...) is inherited
# from application.properties.
spring.datasource.url=jdbc:postgresql://localhost:5433/ecommerce_e2e
spring.datasource.username=ecommerce
spring.datasource.password=ecommerce

# Keep E2E runs readable when a test fails.
spring.jpa.show-sql=false
logging.level.org.springframework.security=INFO