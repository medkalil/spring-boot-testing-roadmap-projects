# Common configuration. The E2E profile (src/main/resources/application-e2e.properties)
# overrides ONLY the datasource - the schema rules below apply to every environment.

# Flyway creates and owns the schema; Hibernate only validates its mapping against it,
# exactly like Phase 10. If the entities drift from the migrations, startup fails loudly.
spring.jpa.hibernate.ddl-auto=validate

# No lazy loading traffic after the request: services map everything to DTOs inside
# their @Transactional boundary.
spring.jpa.open-in-view=false

# --- JWT ---
# Dev/test-only secret. In a real deployment this MUST come from an environment
# variable, never from a committed file.
app.jwtSecret=Ret6zaZ4OVqn52m/3jk9H+Qb/dTywg8aIg7teS1cwQDNTf8Z89E7FW2np5uqf/FH
app.jwtExpirationMs=3600000
app.jwtRefreshExpirationMs=604800000

# Jackson: keep the wire format predictable (no timestamps as arrays).
spring.jackson.serialization.write-dates-as-timestamps=false