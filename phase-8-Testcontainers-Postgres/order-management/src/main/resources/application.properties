# ---------------------------------------------------------------------------
# The integration tests do NOT use these values.
# OrderIntegrationTest overrides url / username / password at runtime through
# @DynamicPropertySource, so tests always connect to the temporary PostgreSQL
# container Testcontainers starts for them (on a random host port).
#
# They only matter if you ever run the application yourself:
#   mvn spring-boot:run
# against a PostgreSQL you started by hand on port 5432.
# ---------------------------------------------------------------------------
spring.datasource.url=jdbc:postgresql://localhost:5432/orders
spring.datasource.username=postgres
spring.datasource.password=postgres

# Flyway creates the schema (Phase 8.8). It runs before Hibernate on startup,
# so the test container starts empty and ends up with the production-like
# schema created by V1 + V2 + V3.
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# Hibernate must NOT create/drop tables: Flyway already owns the schema.
# "validate" makes the application fail fast if the entities and the
# Flyway schema ever drift apart - exactly what production does.
spring.jpa.hibernate.ddl-auto=validate

# Everything happens inside the service transactions (DTOs are built there),
# so no lazy loading is needed while rendering the response.
spring.jpa.open-in-view=false