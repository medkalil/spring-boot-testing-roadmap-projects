# ---------------------------------------------------------------------------
# Phase 9 — Spring Security Testing
#
# The authorization tests use @WebMvcTest, which loads ONLY:
#
#   MockMvc -> Spring Security -> Controller -> (@MockitoBean) Service
#
# So no DataSource is needed for them, and this file is barely touched by them.
#
# H2 (test scope) is what makes a later @SpringBootTest work without any
# external database: Spring Boot auto-configures an in-memory H2 and Hibernate
# creates the tables from the entities (create-drop for embedded databases).
# ---------------------------------------------------------------------------
spring.jpa.open-in-view=false

spring.application.name=role-based-access-api