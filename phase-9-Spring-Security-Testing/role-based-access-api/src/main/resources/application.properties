spring.application.name=role-based-access-api

# The in-memory store is never written to by Hibernate; the @Entity User only
# exists so the domain model is complete. Keep this off to catch accidental
# managed-context usage.
spring.jpa.open-in-view=false

# ---------------------------------------------------------------------------
# JWT (Layer 3 - real authentication: login -> JWT -> protected endpoint)
# ---------------------------------------------------------------------------
# Dev-only signing secret, BASE64 encoded. After decoding it must be at least
# 32 bytes for HS256 (this one decodes to 48).
# NEVER commit a real secret: in production inject it from the environment,
# e.g. app.jwtSecret=${JWT_SECRET}.
app.jwtSecret=Ret6zaZ4OVqn52m/3jk9H+Qb/dTywg8aIg7teS1cwQDNTf8Z89E7FW2np5uqf/FH

# Token lifetime: 1 hour. Tests that need an EXPIRED token do not wait for this -
# they build one on purpose with a past expiration date (see JwtAuthenticationTest).
app.jwtExpirationMs=3600000
