spring.application.name=multi-tenant-saas-api

# ---------------------------------------------------------------------------
# The integration tests do NOT use these values.
# MultiTenantIntegrationTest overrides url / username / password at runtime
# through @DynamicPropertySource, so tests always connect to the temporary
# PostgreSQL container Testcontainers starts for them (on a random host port).
#
# They only matter if you ever run the application yourself:
#   mvn spring-boot:run
# against a PostgreSQL you started by hand on port 5432.
# ---------------------------------------------------------------------------
spring.datasource.url=jdbc:postgresql://localhost:5432/multitenant
spring.datasource.username=postgres
spring.datasource.password=postgres

# Flyway creates the schema (V1..V5). It runs before Hibernate on startup,
# so the test container starts empty and ends up with the production-like
# schema: users, organizations, memberships, projects, tasks.
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# Hibernate must NOT create/drop tables: Flyway already owns the schema.
# "validate" makes the application fail fast if the entities and the Flyway
# schema ever drift apart - exactly what production does.
spring.jpa.hibernate.ddl-auto=validate

# Everything happens inside the service transactions (DTOs are built there),
# so no lazy loading is needed while rendering the response.
spring.jpa.open-in-view=false

# ---------------------------------------------------------------------------
# JWT (same mechanism as Phase 9, but the subject is the user's EMAIL and the
# per-organization roles are NOT in the token - they live in the memberships
# table and are looked up per request, because one user can have a different
# role in every organization.)
# ---------------------------------------------------------------------------
# Dev-only signing secret, BASE64 encoded (decodes to 48 bytes >= 32 for HS256).
# NEVER commit a real secret: inject it from the environment in production.
app.jwtSecret=Ret6zaZ4OVqn52m/3jk9H+Qb/dTywg8aIg7teS1cwQDNTf8Z89E7FW2np5uqf/FH
app.jwtExpirationMs=3600000
app.jwtRefreshExpirationMs=604800000
